apiVersion: octroi.ai/v1
kind: Action
metadata:
  slug: net.rotate-certs
  owner: Platform Team
  description: Renews a TLS certificate before it expires.
contract:
  risk: reversible
  reversal:
    kind: self-healing
  idempotent: true
  inputs:
    type: object
    properties:
      cert:
        type: string
    required:
    - cert
    additionalProperties: true
  timeout: PT10M
  approval:
    minimum: human
  environments:
    protected: allow-with-change-ref
implementation:
  executor: container
  image: certbot/certbot:v2.11.0@sha256:ddf9e5d226a56e886986838fa0ebedc0237511c78664352e8d0f4346ee022cd8
  args:
  - renew
  - --cert-name
  - '{{ inputs.cert }}'
