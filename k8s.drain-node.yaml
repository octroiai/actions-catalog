apiVersion: octroi.ai/v1
kind: Action
metadata:
  slug: k8s.drain-node
  owner: Platform Team
  description: Evicts every pod from a node ahead of maintenance.
contract:
  risk: reversible
  reversal:
    kind: action
    action: k8s.uncordon-node
  idempotent: false
  inputs:
    type: object
    properties:
      node:
        type: string
    required:
    - node
    additionalProperties: true
  tags:
  - kubernetes
  concurrency:
    lock: node-eviction
  timeout: PT15M
  approval:
    minimum: human
  environments:
    protected: deny
implementation:
  executor: container
  image: bitnamilegacy/kubectl:1.30@sha256:1249fc292e84a38575ee0cadc3e28dcd7ddf5a3a4e5da401b1a8599e8ac52a1b
  args:
  - drain
  - '{{ inputs.node }}'
  - --ignore-daemonsets
